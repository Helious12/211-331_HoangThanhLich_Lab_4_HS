version: '3.8'

services:
  monitor:
    image: citusdata/pg_auto_failover:v2.0-pg15
    container_name: monitor
    environment:
      PGDATA: /var/lib/postgres/pgaf
      PG_AUTOCTL_DEBUG: 1
      TZ: 'Europe/Moscow'
    command: pg_autoctl create monitor --ssl-self-signed --auth trust --run
    ports:
      - "5500:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_auto_failover"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - /var/lib/postgres

  node1:
    image: citusdata/pg_auto_failover:v2.0-pg15
    container_name: node1
    environment:
      PGDATA: /var/lib/postgres/pgaf
      PGUSER: admin
      PGPASSWORD: password
      PGDATABASE: analytics
      PG_AUTOCTL_MONITOR: "postgresql://autoctl_node@monitor/pg_auto_failover"
      TZ: 'Europe/Moscow'
    command: pg_autoctl create postgres --name node1 --ssl-self-signed --auth trust --pg-hba-lan --run
    ports:
      - "5432:5432"
    depends_on:
      monitor:
        condition: service_healthy
    volumes:
      - ./node_init.sql:/docker-entrypoint-initdb.d/node_init.sql
      - /var/lib/postgres
    networks:
      default:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  node2:
    image: citusdata/pg_auto_failover:v2.0-pg15
    container_name: node2
    environment:
      PGDATA: /var/lib/postgres/pgaf
      PGUSER: admin
      PGPASSWORD: password
      PGDATABASE: analytics
      PG_AUTOCTL_MONITOR: "postgresql://autoctl_node@monitor/pg_auto_failover"
      TZ: 'Europe/Moscow'
    command: pg_autoctl create postgres --name node2 --ssl-self-signed --auth trust --pg-hba-lan --run
    ports:
      - "5433:5432"
    depends_on:
      monitor:
        condition: service_healthy
    volumes:
      - ./node_init.sql:/docker-entrypoint-initdb.d/node_init.sql
      - /var/lib/postgres
    networks:
      default:
        ipv4_address: 172.20.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  node3:
    image: citusdata/pg_auto_failover:v2.0-pg15
    container_name: node3
    environment:
      PGDATA: /var/lib/postgres/pgaf
      PGUSER: admin
      PGPASSWORD: password
      PGDATABASE: analytics
      PG_AUTOCTL_MONITOR: "postgresql://autoctl_node@monitor/pg_auto_failover"
      TZ: 'Europe/Moscow'
    command: pg_autoctl create postgres --name node3 --ssl-self-signed --auth trust --pg-hba-lan --run
    ports:
      - "5434:5432"
    depends_on:
      monitor:
        condition: service_healthy
    volumes:
      - ./node_init.sql:/docker-entrypoint-initdb.d/node_init.sql
      - /var/lib/postgres
    networks:
      default:
        ipv4_address: 172.20.0.6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  haproxy:
    build: ./haproxy
    container_name: haproxy
    ports:
      - "5435:5432"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "analytics", "-h", "localhost", "-p", "5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  audit_db:
    image: postgres:15
    container_name: audit_db
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: auditpass
      POSTGRES_DB: auditlog
    volumes:
      - ./audit_db_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d auditlog"]
      interval: 5s
      timeout: 3s
      retries: 5

  audit_service:
    build: ./audit_service
    container_name: audit_service
    environment:
      DB_HOST: audit_db
      DB_PORT: 5432
      DB_USER: audit
      DB_PASSWORD: auditpass
      DB_NAME: auditlog
    ports:
      - "8005:8005"
    restart: always
    depends_on:
      audit_db:
        condition: service_healthy

  user_service:
    build: ./user_service
    container_name: user_service
    environment:
      DB_HOST: haproxy
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: analytics
    ports:
      - "8001:8001"
    expose:
      - "8001"
    restart: always
    depends_on:
      haproxy:
        condition: service_healthy

  user_service_v2:
    build: ./user_service_v2
    container_name: user_service_v2
    environment:
      DB_HOST: haproxy
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: analytics
    ports:
      - "8012:8001"
    expose:
      - "8001"
    restart: always
    depends_on:
      haproxy:
        condition: service_healthy

  product_service:
    build: ./product_service
    container_name: product_service
    environment:
      DB_HOST: haproxy
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: analytics
    ports:
      - "8002:8002"
    expose:
      - "8002"
    restart: always
    depends_on:
      haproxy:
        condition: service_healthy

  order_service:
    build: ./order_service
    container_name: order_service
    environment:
      DB_HOST: haproxy
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: analytics
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: password
    ports:
      - "8003:8003"
    expose:
      - "8003"
    restart: always
    depends_on:
      haproxy:
        condition: service_healthy

  consumer-service:
    build: ./consumer
    container_name: consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DB_PORT: 5432
      DB_NAME: analytics
      DB_USER: admin
      DB_PASSWORD: password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: password
    # deploy:
    #   replicas: 2

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:password@haproxy:5435/analytics?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      haproxy:
        condition: service_healthy

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"

  pg_backup:
    image: postgres:15
    container_name: pg_backup
    environment:
      PGPASSWORD: password
    volumes:
      - ./backup:/backup
      - ./pg_backup/backup.sh:/backup.sh
    entrypoint: ["bash", "/backup.sh"]
    depends_on:
      node1:
        condition: service_healthy

  dnsmasq:
    image: andyshinn/dnsmasq
    container_name: dnsmasq
    command:
      - "--log-facility=-"
      - "--server=8.8.8.8"
      - "--address=/ru.myapi.local/172.20.0.14"
      - "--address=/eu.myapi.local/172.20.0.15"
    ports:
      - "5553:53/udp"
    networks:
      default:
        ipv4_address: 172.20.0.30

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    volumes:
      - frontend-build:/app/dist

  # nginx:
  #   image: nginx:latest
  #   container_name: nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - frontend-build:/usr/share/nginx/html
  #   depends_on:
  #     - user_service
  #     - user_service_v2
  #     - product_service
  #     - order_service

  nginx_ru:
    image: nginx:latest
    container_name: nginx_ru
    ports:
      - "8081:80"
    volumes:
      - ./nginx_ru/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-build:/usr/share/nginx/html  # nếu cần giao diện
    depends_on:
      - user_service
    networks:
      default:
        ipv4_address: 172.20.0.14

  nginx_eu:
    image: nginx:latest
    container_name: nginx_eu
    ports:
      - "8082:80"
    volumes:
      - ./nginx_eu/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-build:/usr/share/nginx/html
    depends_on:
      - user_service_v2
    networks:
      default:
        ipv4_address: 172.20.0.15

  emulator:
    build: ./emulator
    container_name: emulator
    environment:
      - ORDER_API=http://order_service:8003/order
    depends_on:
      - order_service
    restart: unless-stopped
    # deploy:
    #   replicas: 10

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pg_data:
  rabbitmq_data:
  grafana_data:
  prometheus_data:
  frontend-build:
