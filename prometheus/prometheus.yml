global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'user_service'
    static_configs:
      - targets: ['user_service:8001']
  - job_name: 'product_service'
    static_configs:
      - targets: ['product_service:8002']
  - job_name: 'order_service'
    static_configs:
      - targets: ['order_service:8003']
  - job_name: 'consumer'
    static_configs:
      - targets: ['consumer:8006']



